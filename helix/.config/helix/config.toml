theme="catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
completion-timeout = 5
completion-replace = true
bufferline = "multiple"
clipboard-provider = "x-clip"
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "block"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.lsp]
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]
#separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[keys.normal]
"A-." = ":buffer-next"
"A-," = ":buffer-previous"
"A-w" = ":buffer-close"
"A-x" = "select_line_above"
"A-X" = "select_line_below"

[keys.select]
"A-x" = "select_line_above"
"A-X" = "select_line_below"
