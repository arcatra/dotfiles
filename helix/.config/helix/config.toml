theme="catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
completion-timeout = 5
completion-replace = true
bufferline = "multiple"
clipboard-provider = "x-clip"
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "block"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.lsp]
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "spacer", "version-control", "spacer", "file-name", "file-modification-indicator"]
center = ["file-absolute-path"]
right = ["diagnostics", "separator", "selections", "separator", "position", "separator", "total-line-numbers","separator", "file-type"]
separator = ""
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.inline-diagnostics]
cursor-line="error"

[keys.normal]
"A-l" = ":buffer-next"
"A-h" = ":buffer-previous"
"A-w" = ":buffer-close"
"A-x" = "select_line_above"
"A-X" = "select_line_below"
"A-;" = "flip_selections"
"," = "keep_primary_selection" # Default is , 
"A-," = "remove_primary_selection"

[keys.normal.space]
"o" = ":format"
"l" = ":rl" # :reload


[keys.select]
"A-x" = "select_line_above"
"A-X" = "select_line_below"
"," = "keep_primary_selection" # Default is ,
"A-," = "remove_primary_selection"
